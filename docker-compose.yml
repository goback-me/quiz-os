version: '3.8'

services:
  quizos-db:
    image: postgres:16-alpine
    container_name: quizos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quizos
    volumes:
      - quizos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizos"]
      interval: 5s
      timeout: 5s
      retries: 5
    # No host port published and NOT on root_default — matches your other apps
    # (gingin-forecast-db, coach_os_postgres, hive_os_postgres). Only quizos (the app)
    # can reach it, over this project's own default network.

  quizos:
    build:
      context: .
      shm_size: '1gb' # Next.js builds can OOM without this on smaller VPS instances
    container_name: quizos
    restart: unless-stopped
    depends_on:
      quizos-db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - default        # to reach quizos-db, same as every other app+db pair on this VPS
      - root_default    # so Traefik can route to it
    labels:
      - traefik.enable=true
      - traefik.http.routers.quizos.rule=Host(`embed.hivesocial.com.au`)
      - traefik.http.routers.quizos.entrypoints=web,websecure
      - traefik.http.routers.quizos.tls=true
      - traefik.http.routers.quizos.tls.certresolver=mytlschallenge
      - traefik.http.services.quizos.loadbalancer.server.port=3000

networks:
  root_default:
    external: true
  # `default` is created automatically by compose, scoped to this project only —
  # same pattern your other app+db pairs already use.

volumes:
  quizos_pgdata:
