version: '3.8'

services:
  quizos-db:
    image: postgres:16-alpine
    container_name: quizos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: quizos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: quizos
    volumes:
      - quizos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quizos"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - root_default
    # No host port published — only reachable by other containers on root_default,
    # never from outside the VPS. Simpler single-network setup, matching how this VPS's
    # other app+db pairs are actually wired (no cross-network Traefik routing issues).

  migrate:
    build:
      context: .
      target: builder
    container_name: quizos-migrate
    env_file:
      - .env
    networks:
      - root_default
    profiles: ["tools"] # never starts with `docker compose up` — invoke explicitly, see README

  quizos:
    build:
      context: .
      shm_size: '1gb' # Next.js builds can OOM without this on smaller VPS instances
    container_name: quizos
    restart: unless-stopped
    depends_on:
      quizos-db:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - root_default
    labels:
      - traefik.enable=true
      - traefik.http.routers.quizos.rule=Host(`${APP_DOMAIN}`)
      - traefik.http.routers.quizos.entrypoints=web,websecure
      - traefik.http.routers.quizos.tls=true
      - traefik.http.routers.quizos.tls.certresolver=mytlschallenge
      - traefik.http.services.quizos.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          # Calculated as 60% of this VPS's actual capacity (2 cores, ~2.8GB available at time of
          # writing) — re-check with `nproc --all` and `free -h` if the VPS's load changes a lot.
          cpus: '1.2'
          memory: 1.7G

networks:
  root_default:
    external: true

volumes:
  quizos_pgdata: